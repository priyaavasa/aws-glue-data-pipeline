AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Event-driven AWS data pipeline using S3, Lambda, AWS Glue Workflow,
  Glue Crawler, Glue Data Catalog, and Glue Python Shell transformation.

Parameters:

  InputBucketName:
    Type: String
    Default: priya-cfn-glue-input-2026

  OutputBucketName:
    Type: String
    Default: priya-cfn-glue-output-2026

  ScriptsBucketName:
    Type: String
    Default: priya-cfn-glue-scripts-2026

  WorkflowName:
    Type: String
    Default: sales-cfn-pipeline-workflow

  CrawlerName:
    Type: String
    Default: sales-cfn-input-crawler

  JobName:
    Type: String
    Default: sales-cfn-transformation-job

  DatabaseName:
    Type: String
    Default: sales_cfn_pipeline_db


Resources:

  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSGlueServiceRole-SalesCfnCrawler
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: SalesCfnCrawlerInputS3Read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}/*'


  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSGlueServiceRole-SalesCfnJob
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: SalesCfnJobS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}/*'

              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ScriptsBucketName}'

              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ScriptsBucketName}/*'

              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${OutputBucketName}/*'


  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSLambdaServiceRole-SalesCfnPipeline
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartSalesCfnPipelineWorkflow
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartWorkflowRun
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:workflow/${WorkflowName}'


  SalesPipelineLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sales-cfn-pipeline-trigger
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref ScriptsBucketName
        S3Key: lambda/lambda_function.zip


  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SalesPipelineLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'


  InputBucketNotification:
    Type: Custom::S3Notification
    DependsOn:
      - AllowS3InvokeLambda
    Properties:
      ServiceToken: !GetAtt S3NotificationFunction.Arn
      BucketName: !Ref InputBucketName
      LambdaArn: !GetAtt SalesPipelineLambda.Arn


  S3NotificationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSLambdaServiceRole-S3Notification
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConfigureS3Notification
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${InputBucketName}'

  S3NotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt S3NotificationFunctionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")

          def handler(event, context):
              bucket = event["ResourceProperties"]["BucketName"]
              lambda_arn = event["ResourceProperties"]["LambdaArn"]

              try:
                  request_type = event["RequestType"]

                  if request_type == "Delete":
                      try:
                          current = s3.get_bucket_notification_configuration(
                              Bucket=bucket
                          )
                      except s3.exceptions.NoSuchBucket:
                          cfnresponse.send(
                              event,
                              context,
                              cfnresponse.SUCCESS,
                              {}
                          )
                          return

                      lambda_configs = current.get(
                          "LambdaFunctionConfigurations",
                          []
                      )

                      remaining_lambda_configs = [
                          config
                          for config in lambda_configs
                          if config.get("LambdaFunctionArn") != lambda_arn
                      ]

                      notification_configuration = {}

                      if remaining_lambda_configs:
                          notification_configuration[
                              "LambdaFunctionConfigurations"
                          ] = remaining_lambda_configs

                      if current.get("QueueConfigurations"):
                          notification_configuration[
                              "QueueConfigurations"
                          ] = current["QueueConfigurations"]

                      if current.get("TopicConfigurations"):
                          notification_configuration[
                              "TopicConfigurations"
                          ] = current["TopicConfigurations"]

                      if current.get("EventBridgeConfiguration"):
                          notification_configuration[
                              "EventBridgeConfiguration"
                          ] = current["EventBridgeConfiguration"]

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=notification_configuration
                      )

                  else:
                      current = s3.get_bucket_notification_configuration(
                          Bucket=bucket
                      )

                      lambda_configs = current.get(
                          "LambdaFunctionConfigurations",
                          []
                      )

                      lambda_configs = [
                          config
                          for config in lambda_configs
                          if config.get("LambdaFunctionArn") != lambda_arn
                      ]

                      lambda_configs.append(
                          {
                              "LambdaFunctionArn": lambda_arn,
                              "Events": ["s3:ObjectCreated:*"]
                          }
                      )

                      notification_configuration = {}

                      if lambda_configs:
                          notification_configuration[
                              "LambdaFunctionConfigurations"
                          ] = lambda_configs

                      if current.get("QueueConfigurations"):
                          notification_configuration[
                              "QueueConfigurations"
                          ] = current["QueueConfigurations"]

                      if current.get("TopicConfigurations"):
                          notification_configuration[
                              "TopicConfigurations"
                          ] = current["TopicConfigurations"]

                      if current.get("EventBridgeConfiguration"):
                          notification_configuration[
                              "EventBridgeConfiguration"
                          ] = current["EventBridgeConfiguration"]

                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration=notification_configuration
                      )

                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {},
                      "S3Notification-" + bucket
                  )

              except Exception as error:
                  print(f"Error configuring S3 notification: {error}")

                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.FAILED,
                      {
                          "Error": str(error)
                      },
                      "S3Notification-" + bucket
                  )


  SalesDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref DatabaseName
        Description: Data Catalog database for the CloudFormation sales pipeline.


  SalesCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Ref CrawlerName
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref DatabaseName
      Targets:
        S3Targets:
          - Path: !Sub 's3://${InputBucketName}/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING


  SalesTransformationJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Ref JobName
      Role: !GetAtt GlueJobRole.Arn
      GlueVersion: '4.0'
      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub 's3://${ScriptsBucketName}/glue/sales_transformation.py'
      DefaultArguments:
        '--WORKFLOW_NAME': !Ref WorkflowName
        '--job-language': python
        '--enable-metrics': ''
      MaxCapacity: 0.0625
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Description: >
        Python Shell job that transforms sales CSV data and writes
        processed output to S3.


  SalesWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Ref WorkflowName
      Description: Event-driven CloudFormation sales data processing workflow.


  StartCrawlerTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: sales-cfn-start-crawler
      Type: ON_DEMAND
      WorkflowName: !Ref WorkflowName
      Actions:
        - CrawlerName: !Ref CrawlerName


  CrawlerSuccessTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: sales-cfn-crawler-success-start-job
      Type: CONDITIONAL
      StartOnCreation: true
      WorkflowName: !Ref WorkflowName
      Predicate:
        Logical: AND
        Conditions:
          - LogicalOperator: EQUALS
            CrawlState: SUCCEEDED
            CrawlerName: !Ref CrawlerName
      Actions:
        - JobName: !Ref JobName


Outputs:

  InputBucket:
    Description: CloudFormation input S3 bucket
    Value: !Ref InputBucketName

  OutputBucket:
    Description: CloudFormation output S3 bucket
    Value: !Ref OutputBucketName

  ScriptsBucket:
    Description: CloudFormation scripts S3 bucket
    Value: !Ref ScriptsBucketName

  LambdaFunction:
    Description: CloudFormation Lambda pipeline trigger
    Value: !Ref SalesPipelineLambda

  GlueDatabase:
    Description: Glue Data Catalog database
    Value: !Ref SalesDatabase

  GlueCrawler:
    Description: Glue crawler
    Value: !Ref SalesCrawler

  GlueJob:
    Description: Glue transformation job
    Value: !Ref SalesTransformationJob

  GlueWorkflow:
    Description: Glue workflow
    Value: !Ref SalesWorkflow